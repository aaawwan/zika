<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#f5f5f5">
  <title>字卡传讯 · 分组版</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #f5f5f5; --card-bg: #fff; --text: #1a1a1a; --text-sub: #888;
      --accent: #6c6c6c; --bubble-ta: #f0f0f0; --bubble-me: #1a1a1a;
      --text-me: #fff; --border: #e8e8e8; --danger: #e55; --danger-bg: #fff0f0;
    }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text);
      height: 100vh; height: 100dvh;
      display: flex; flex-direction: column;
      max-width: 480px; margin: 0 auto;
      -webkit-tap-highlight-color: transparent; overflow: hidden;
    }

    /* 顶栏 */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10; flex-shrink: 0;
    }
    .header-left { display: flex; align-items: baseline; min-width: 0; }
    .header .name {
      font-size: 16px; font-weight: 600; cursor: pointer;
      max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .header .status { font-size: 11px; color: var(--text-sub); margin-left: 8px; }
    .header-actions { display: flex; gap: 8px; }
    .icon-btn {
      width: 34px; height: 34px; border-radius: 50%; border: none;
      background: var(--bg); color: var(--text); font-size: 15px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .icon-btn:hover { background: #eaeaea; }
    .icon-btn:active { opacity: 0.5; }

    /* 聊天区 */
    .chat-area {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 10px;
      scroll-behavior: smooth; overscroll-behavior: contain;
    }
    .chat-area::-webkit-scrollbar { width: 0; }
    .msg-row { display: flex; animation: fadeIn 0.28s ease; }
    .msg-row.ta { justify-content: flex-start; }
    .msg-row.me { justify-content: flex-end; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .bubble {
      max-width: 78%; padding: 10px 14px; border-radius: 19px;
      font-size: 14px; line-height: 1.55; word-break: break-word;
    }
    .msg-row.ta .bubble { background: var(--bubble-ta); border-bottom-left-radius: 5px; }
    .msg-row.me .bubble { background: var(--bubble-me); color: var(--text-me); border-bottom-right-radius: 5px; }
    .tag {
      display: inline-block; font-size: 9px; padding: 1px 6px;
      border-radius: 6px; margin-left: 5px; vertical-align: middle; opacity: 0.65;
    }
    .msg-row.ta .tag { background: rgba(0,0,0,0.07); }
    .msg-row.me .tag { background: rgba(255,255,255,0.2); }

    /* 输入区 */
    .input-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 16px 14px; background: var(--card-bg);
      border-top: 1px solid var(--border); flex-shrink: 0;
      padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    }
    .input-bar input {
      flex: 1; min-width: 0; border: none; outline: none;
      background: var(--bg); padding: 10px 16px; border-radius: 24px;
      font-size: 14px; color: var(--text);
    }
    .input-bar input::placeholder { color: #bbb; }
    .send-btn {
      width: 39px; height: 39px; border-radius: 50%; border: none;
      background: var(--bubble-me); color: #fff; font-size: 16px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: transform 0.12s;
    }
    .send-btn:active { transform: scale(0.88); }

    /* 面板 */
    .panel {
      position: fixed; inset: 0; background: rgba(0,0,0,0.35);
      z-index: 110; display: none; align-items: flex-end; justify-content: center;
    }
    .panel.open { display: flex; }
    .panel-inner {
      width: 100%; max-width: 480px; background: var(--card-bg);
      border-radius: 22px 22px 0 0; padding: 20px 18px;
      max-height: 86vh; overflow-y: auto;
      animation: slideUp 0.26s ease;
      padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .panel-title {
      font-size: 16px; font-weight: 620; margin-bottom: 14px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .panel-title em { font-size: 12px; color: var(--text-sub); font-style: normal; font-weight: 390; margin-left: 6px; }
    .panel-close { border: none; background: none; font-size: 21px; cursor: pointer; color: var(--text-sub); padding: 2px 6px; line-height: 1; }

    /* 分组标签栏 */
    .group-tabs {
      display: flex; gap: 6px; overflow-x: auto;
      padding-bottom: 4px; margin-bottom: 14px;
      scrollbar-width: none;
    }
    .group-tabs::-webkit-scrollbar { display: none; }
    .group-tab {
      flex-shrink: 0; padding: 6px 14px; border-radius: 18px;
      border: none; background: var(--bg); color: var(--text-sub);
      font-size: 13px; cursor: pointer; transition: all 0.18s;
      display: flex; align-items: center; gap: 4px;
    }
    .group-tab.active { background: var(--bubble-me); color: #fff; }
    .group-tab .count { font-size: 10px; opacity: 0.58; }
    .group-tab.active .count { opacity: 0.82; }

    /* 字卡列表 */
    .card-list {
      display: flex; flex-direction: column; gap: 8px;
      max-height: 36vh; overflow-y: auto;
      padding: 4px 0; margin-bottom: 14px;
    }
    .card-list::-webkit-scrollbar { width: 0; }

    .card-item {
      display: flex; align-items: center; gap: 10px;
      background: var(--bg); border-radius: 14px;
      padding: 9px 14px; animation: fadeIn 0.2s ease;
    }
    .card-item .card-text {
      flex: 1; font-size: 14px; line-height: 1.45;
      word-break: break-word; outline: none;
      border-bottom: 1px dashed transparent;
      transition: border-color 0.2s;
    }
    .card-item .card-text:focus { border-bottom-color: var(--accent); }
    .card-item .card-tag {
      font-size: 10px; color: var(--text-sub);
      background: rgba(0,0,0,0.045);
      padding: 2px 10px; border-radius: 10px;
      flex-shrink: 0; cursor: pointer; outline: none; max-width: 70px;
      text-align: center;
    }
    .card-item .card-tag:focus { background: rgba(0,0,0,0.08); }
    .card-item .card-del {
      border: none; background: none; color: #ccc;
      font-size: 16px; cursor: pointer; padding: 0 4px; flex-shrink: 0;
      transition: color 0.15s;
    }
    .card-item .card-del:hover { color: var(--danger); }

    /* 添加行 */
    .card-add {
      display: flex; gap: 8px; margin-bottom: 14px;
    }
    .card-add input {
      flex: 1; border: 1px solid var(--border); border-radius: 14px;
      padding: 10px 14px; font-size: 14px; outline: none;
      background: var(--bg); color: var(--text);
    }
    .card-add input:focus { border-color: var(--accent); }
    .card-add button {
      border: none; background: var(--bubble-me); color: #fff;
      padding: 0 20px; border-radius: 14px; font-size: 14px;
      cursor: pointer; font-weight: 490; flex-shrink: 0;
    }
    .card-add button:active { opacity: 0.72; }

    /* 按钮 */
    .panel-btns { display: flex; gap: 10px; margin-top: 10px; }
    .btn {
      flex: 1; padding: 10px; border-radius: 14px; border: none;
      font-size: 14px; cursor: pointer; font-weight: 470;
    }
    .btn:active { opacity: 0.68; }
    .btn-primary { background: var(--bubble-me); color: #fff; }
    .btn-secondary { background: var(--bg); color: var(--text); }
    .btn-danger { background: var(--danger-bg); color: var(--danger); }

    /* 高级选项 */
    .advanced {
      margin-top: 16px; border-top: 1px solid var(--border);
      padding-top: 14px;
    }
    .advanced summary {
      font-size: 13px; color: var(--text-sub);
      cursor: pointer; list-style: none; padding: 4px 0;
      display: flex; align-items: center; gap: 6px;
    }
    .advanced summary::-webkit-details-marker { display: none; }
    .advanced summary::before { content: '▸'; font-size: 10px; transition: transform 0.2s; }
    .advanced[open] summary::before { transform: rotate(90deg); }
    .advanced textarea {
      width: 100%; height: 115px; margin-top: 10px;
      border: 1px solid var(--border); border-radius: 14px;
      padding: 12px; font-size: 12px;
      font-family: "SF Mono", Consolas, Menlo, monospace;
      resize: vertical; outline: none; background: var(--bg); color: var(--text);
      line-height: 1.5;
    }
    .advanced textarea:focus { border-color: var(--accent); }
    .advanced .hint { font-size: 11px; color: var(--text-sub); margin: 8px 0; line-height: 1.6; }

    .empty-tip {
      text-align: center; color: var(--text-sub); font-size: 12px;
      padding: 44px 20px; line-height: 1.8; margin: auto 0;
    }
    .empty-cards {
      text-align: center; color: var(--text-sub); font-size: 12px;
      padding: 24px; line-height: 1.6;
    }
    .typing { display: flex; gap: 4px; padding: 12px 16px; align-items: center; }
    .typing span {
      width: 6px; height: 6px; border-radius: 50%; background: #bbb;
      animation: bounce 1.3s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.33s; }
    @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }
  </style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <span class="name" id="contactName" title="点击重命名">TA</span>
    <span class="status" id="contactStatus">在线</span>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="btnPanel" title="字卡库">⚙</button>
    <button class="icon-btn" id="btnClear" title="清空聊天">✕</button>
  </div>
</header>

<main class="chat-area" id="chatArea">
  <div class="empty-tip" id="emptyTip">
    还没有消息<br>
    在下方输入内容开始对话
  </div>
</main>

<footer class="input-bar">
  <input type="text" id="msgInput" placeholder="输入消息..." maxlength="260" autocomplete="off">
  <button class="send-btn" id="sendBtn">↑</button>
</footer>

<div class="panel" id="panel">
  <div class="panel-inner">
    <div class="panel-title">
      <span>字卡库 <em id="cardCount"></em></span>
      <button class="panel-close" id="btnPanelClose">✕</button>
    </div>

    <!-- 分组标签 -->
    <div class="group-tabs" id="groupTabs"></div>

    <!-- 字卡列表 -->
    <div class="card-list" id="cardList"></div>

    <!-- 添加 -->
    <div class="card-add">
      <input type="text" id="newCardInput" placeholder="输入新字卡..." maxlength="64">
      <button id="btnAddCard">添加</button>
    </div>

    <!-- 高级 -->
    <details class="advanced">
      <summary>高级选项（JSON 导入 / 导出）</summary>
      <p class="hint">
        格式：<code>{"text": "内容", "tag": "分组"}</code>
      </p>
      <textarea id="cardInput" spellcheck="false"></textarea>
      <div class="panel-btns">
        <button class="btn btn-secondary" id="btnExport">导出</button>
        <button class="btn btn-primary" id="btnImport">导入</button>
      </div>
    </details>

    <div class="panel-btns" style="margin-top:16px;">
      <button class="btn btn-secondary" id="btnDefault">恢复默认</button>
      <button class="btn btn-danger" id="btnWipe">清除全部数据</button>
    </div>
  </div>
</div>

<script>
/* ===================== 数据层 ===================== */
const STORAGE_KEYS = {
  MESSAGES: 'zikao_messages_v2',
  CARDS: 'zikao_cards_v2',
  NAME: 'zikao_contact_name_v2'
};

/* 预置字卡：按分组排列 —— 更丰富、更平衡 */
const DEFAULT_CARDS = [
  { text: "刚吃完饭", tag: "日常" },
  { text: "今天天气真好", tag: "日常" },
  { text: "在听你说呢", tag: "日常" },
  { text: "别熬夜啦", tag: "日常" },
  { text: "刚睡醒", tag: "日常" },
  { text: "在忙工作", tag: "日常" },
  { text: "刚到家", tag: "日常" },
  { text: "准备去洗澡", tag: "日常" },
  { text: "今天吃什么", tag: "日常" },
  { text: "出门啦", tag: "日常" },
  { text: "刚刚看到一只猫", tag: "日常" },
  { text: "在晒太阳", tag: "日常" },
  { text: "有点想喝奶茶", tag: "日常" },
  { text: "手机快没电了", tag: "日常" },
  { text: "在听歌", tag: "日常" },
  { text: "开心", tag: "情绪" },
  { text: "有点累", tag: "情绪" },
  { text: "有点委屈", tag: "情绪" },
  { text: "好困", tag: "情绪" },
  { text: "心情不错", tag: "情绪" },
  { text: "有点烦躁", tag: "情绪" },
  { text: "好无聊", tag: "情绪" },
  { text: "有点想哭", tag: "情绪" },
  { text: "压力有点大", tag: "情绪" },
  { text: "突然有点emo", tag: "情绪" },
  { text: "今天也想你了", tag: "心意" },
  { text: "在想你呢", tag: "心意" },
  { text: "抱抱", tag: "心意" },
  { text: "想见你", tag: "心意" },
  { text: "喜欢你", tag: "心意" },
  { text: "有你在真好", tag: "心意" },
  { text: "偷偷看你头像", tag: "心意" },
  { text: "想牵着你的手", tag: "心意" },
  { text: "你最重要了", tag: "心意" },
  { text: "一直在想你", tag: "心意" },
  { text: "在忙，稍等", tag: "意图" },
  { text: "好呀，听你的", tag: "意图" },
  { text: "等下找你", tag: "意图" },
  { text: "嗯…让我想想", tag: "意图" },
  { text: "等我一下下", tag: "意图" },
  { text: "马上回来", tag: "意图" },
  { text: "稍后回复你", tag: "意图" },
  { text: "我看看先", tag: "意图" },
  { text: "一会儿给你打", tag: "意图" },
  { text: "收到啦", tag: "意图" },
  { text: "晚安，做个好梦", tag: "晚安" },
  { text: "早点睡，别熬夜", tag: "晚安" },
  { text: "梦里见", tag: "晚安" },
  { text: "盖好被子", tag: "晚安" },
  { text: "我先睡啦", tag: "晚安" },
  { text: "晚安好梦", tag: "晚安" },
  { text: "明天见", tag: "晚安" },
  { text: "好梦", tag: "晚安" },
  { text: "嗯嗯", tag: "随机" },
  { text: "哈哈哈", tag: "随机" },
  { text: "摸摸头", tag: "随机" },
  { text: "？？？", tag: "随机" },
  { text: "真的吗", tag: "随机" },
  { text: "好的", tag: "随机" },
  { text: "我也是", tag: "随机" },
  { text: "那挺好的", tag: "随机" },
  { text: "嗯…", tag: "随机" },
  { text: "诶嘿", tag: "随机" },
];

const CONFIG = {
  replyDelayMin: 700,
  replyDelayMax: 1900,
  thinkingTime: 320,
  replyChance: 1.0
};

/* ===================== 存储层 ===================== */
function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? (JSON.parse(raw) ?? fallback) : fallback;
  } catch { return fallback; }
}
function saveJSON(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

let messages = loadJSON(STORAGE_KEYS.MESSAGES, []);
let cards = loadJSON(STORAGE_KEYS.CARDS, DEFAULT_CARDS);
let contactName = localStorage.getItem(STORAGE_KEYS.NAME) || 'TA';

/* ===================== DOM ===================== */
const $ = id => document.getElementById(id);
const chatArea = $('chatArea');
const emptyTip = $('emptyTip');
const msgInput = $('msgInput');
const contactNameEl = $('contactName');
const cardCountEl = $('cardCount');
const panelEl = $('panel');
const cardList = $('cardList');
const groupTabs = $('groupTabs');

let currentGroup = '全部';

/* ===================== 聊天渲染 ===================== */
function renderAll() {
  contactNameEl.textContent = contactName;
  chatArea.innerHTML = '';
  if (messages.length === 0) {
    chatArea.appendChild(emptyTip);
    return;
  }
  const frag = document.createDocumentFragment();
  messages.forEach(msg => frag.appendChild(createBubble(msg)));
  chatArea.appendChild(frag);
  scrollBottom();
}

function createBubble(msg) {
  const row = document.createElement('div');
  row.className = `msg-row ${msg.side}`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = msg.text;
  if (msg.tag) {
    const tagEl = document.createElement('span');
    tagEl.className = 'tag';
    tagEl.textContent = msg.tag;
    bubble.appendChild(tagEl);
  }
  row.appendChild(bubble);
  return row;
}

function appendBubble(msg) {
  const tip = chatArea.querySelector('.empty-tip');
  if (tip) tip.remove();
  chatArea.appendChild(createBubble(msg));
  scrollBottom();
}

function scrollBottom() {
  requestAnimationFrame(() => { chatArea.scrollTop = chatArea.scrollHeight; });
}

/* ===================== 分组 ===================== */
function getGroups() {
  const set = new Set();
  cards.forEach(c => { if (c.tag) set.add(c.tag); });
  return ['全部', ...Array.from(set)];
}

function renderGroupTabs() {
  groupTabs.innerHTML = '';
  const groups = getGroups();

  if (!groups.includes(currentGroup)) currentGroup = '全部';

  groups.forEach(group => {
    const count = group === '全部'
      ? cards.length
      : cards.filter(c => c.tag === group).length;

    const btn = document.createElement('button');
    btn.className = 'group-tab' + (group === currentGroup ? ' active' : '');
    btn.innerHTML = `${group}<span class="count">${count}</span>`;
    btn.addEventListener('click', () => {
      currentGroup = group;
      renderGroupTabs();
      renderCards();
    });
    groupTabs.appendChild(btn);
  });
}

/* ===================== 字卡列表 ===================== */
function getCurrentCards() {
  if (currentGroup === '全部') return cards.map((c, i) => ({ ...c, _index: i }));
  return cards
    .map((c, i) => ({ ...c, _index: i }))
    .filter(c => c.tag === currentGroup);
}

function renderCards() {
  cardCountEl.textContent = `（${cards.length} 张）`;
  cardList.innerHTML = '';

  const list = getCurrentCards();

  if (list.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-cards';
    empty.textContent = '这个分组还没有字卡，在下方添加一张吧 ✨';
    cardList.appendChild(empty);
    return;
  }

  list.forEach(card => {
    const index = card._index;
    const item = document.createElement('div');
    item.className = 'card-item';

    const textEl = document.createElement('div');
    textEl.className = 'card-text';
    textEl.contentEditable = 'true';
    textEl.textContent = card.text;
    textEl.spellcheck = false;
    textEl.addEventListener('blur', () => {
      const newText = textEl.textContent.trim();
      if (newText && newText !== card.text) {
        cards[index].text = newText;
        saveJSON(STORAGE_KEYS.CARDS, cards);
      } else if (!newText) {
        textEl.textContent = card.text;
      }
    });
    textEl.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); textEl.blur(); }
    });

    const tagEl = document.createElement('div');
    tagEl.className = 'card-tag';
    tagEl.contentEditable = 'true';
    tagEl.textContent = card.tag || '';
    tagEl.spellcheck = false;
    tagEl.title = '点击编辑分组';
    tagEl.addEventListener('blur', () => {
      const newTag = tagEl.textContent.trim();
      if (newTag !== card.tag) {
        cards[index].tag = newTag;
        saveJSON(STORAGE_KEYS.CARDS, cards);
        renderGroupTabs();
        renderCards();
      }
    });
    tagEl.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); tagEl.blur(); }
    });

    const delBtn = document.createElement('button');
    delBtn.className = 'card-del';
    delBtn.textContent = '✕';
    delBtn.title = '删除这张字卡';
    delBtn.addEventListener('click', () => {
      cards.splice(index, 1);
      saveJSON(STORAGE_KEYS.CARDS, cards);
      renderGroupTabs();
      renderCards();
    });

    item.appendChild(textEl);
    item.appendChild(tagEl);
    item.appendChild(delBtn);
    cardList.appendChild(item);
  });
}

/* ===================== 发送 ===================== */
function pickCard() {
  if (!cards || cards.length === 0) return { text: '…', tag: '' };
  return cards[Math.floor(Math.random() * cards.length)];
}

function sendMessage() {
  const text = msgInput.value.trim();
  if (!text) return;

  const myMsg = { side: 'me', text, tag: '', time: Date.now() };
  messages.push(myMsg);
  appendBubble(myMsg);
  msgInput.value = '';
  saveJSON(STORAGE_KEYS.MESSAGES, messages);

  if (Math.random() > CONFIG.replyChance) return;

  setTimeout(() => {
    showTyping();
    const delay = CONFIG.replyDelayMin + Math.random() * (CONFIG.replyDelayMax - CONFIG.replyDelayMin);
    setTimeout(() => {
      hideTyping();
      const card = pickCard();
      const taMsg = { side: 'ta', text: card.text, tag: card.tag || '', time: Date.now() };
      messages.push(taMsg);
      appendBubble(taMsg);
      saveJSON(STORAGE_KEYS.MESSAGES, messages);
    }, delay);
  }, CONFIG.thinkingTime);
}

function showTyping() {
  if ($('typingRow')) return;
  const row = document.createElement('div');
  row.className = 'msg-row ta';
  row.id = 'typingRow';
  row.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  chatArea.appendChild(row);
  scrollBottom();
}
function hideTyping() {
  const el = $('typingRow');
  if (el) el.remove();
}

function clearChat() {
  if (!confirm('确定清空全部聊天记录？')) return;
  messages = [];
  saveJSON(STORAGE_KEYS.MESSAGES, messages);
  renderAll();
}

/* ===================== 面板 ===================== */
function openPanel() {
  renderGroupTabs();
  renderCards();
  $('cardInput').value = JSON.stringify(cards, null, 2);
  panelEl.classList.add('open');
}
function closePanel() { panelEl.classList.remove('open'); }

/* 添加字卡（自动归入当前分组） */
$('btnAddCard').addEventListener('click', () => {
  const input = $('newCardInput');
  const text = input.value.trim();
  if (!text) return;
  let tag = (currentGroup === '全部' || currentGroup === '随机') ? '日常' : currentGroup;
  // 如果当前组为空字符串，则归入"日常"
  if (!tag) tag = '日常';
  cards.push({ text, tag });
  saveJSON(STORAGE_KEYS.CARDS, cards);
  input.value = '';
  renderGroupTabs();
  renderCards();
  cardList.scrollTop = cardList.scrollHeight;
  input.focus();
});
$('newCardInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); $('btnAddCard').click(); }
});

/* JSON 导入导出 */
function importCards() {
  try {
    const raw = $('cardInput').value.trim();
    if (!raw) throw new Error('内容为空');
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed)) throw new Error('必须是数组');
    parsed.forEach((c, i) => {
      if (!c || typeof c.text !== 'string' || !c.text.trim())
        throw new Error(`第 ${i + 1} 项缺少 text`);
    });
    cards = parsed.map(c => ({ text: String(c.text).trim(), tag: c.tag ? String(c.tag).trim() : '' }));
    saveJSON(STORAGE_KEYS.CARDS, cards);
    currentGroup = '全部';
    renderGroupTabs();
    renderCards();
    alert(`✅ 导入成功，共 ${cards.length} 张`);
  } catch (e) { alert('❌ 导入失败：' + e.message); }
}

function exportCards() {
  const blob = new Blob([JSON.stringify(cards, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `zikao-cards-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function loadDefaultCards() {
  if (!confirm('将覆盖当前字卡，确定恢复默认？')) return;
  cards = DEFAULT_CARDS.map(c => ({ ...c }));
  saveJSON(STORAGE_KEYS.CARDS, cards);
  currentGroup = '全部';
  renderGroupTabs();
  renderCards();
  $('cardInput').value = JSON.stringify(cards, null, 2);
}

function clearAllData() {
  if (!confirm('将清除聊天记录、字卡库和名字，确定？')) return;
  localStorage.removeItem(STORAGE_KEYS.MESSAGES);
  localStorage.removeItem(STORAGE_KEYS.CARDS);
  localStorage.removeItem(STORAGE_KEYS.NAME);
  messages = [];
  cards = DEFAULT_CARDS.map(c => ({ ...c }));
  contactName = 'TA';
  currentGroup = '全部';
  renderAll();
  renderGroupTabs();
  renderCards();
  closePanel();
}

/* ===================== 事件绑定 ===================== */
$('sendBtn').addEventListener('click', sendMessage);
msgInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); sendMessage(); }
});
$('btnPanel').addEventListener('click', openPanel);
$('btnClear').addEventListener('click', clearChat);
$('btnPanelClose').addEventListener('click', closePanel);
panelEl.addEventListener('click', e => { if (e.target === panelEl) closePanel(); });
$('btnImport').addEventListener('click', importCards);
$('btnExport').addEventListener('click', exportCards);
$('btnDefault').addEventListener('click', loadDefaultCards);
$('btnWipe').addEventListener('click', clearAllData);

contactNameEl.addEventListener('click', () => {
  const n = prompt('输入对方名字：', contactName);
  if (n !== null && n.trim()) {
    contactName = n.trim().slice(0, 20);
    localStorage.setItem(STORAGE_KEYS.NAME, contactName);
    renderAll();
  }
});

/* ===================== 初始化 ===================== */
renderAll();
renderGroupTabs();
renderCards();
if (window.matchMedia('(pointer: fine)').matches) msgInput.focus();
</script>
</body>
</html>
